<!DOCTYPE html>
<html lang="ru" x-data="layout()" x-init="init()" :class="theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>{{ title or 'Панель управления' }}</title>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
<div class="min-h-screen flex">
  <aside class="w-72 hidden lg:block bg-white/95 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 p-4 sticky top-0 h-screen">
    <h1 class="text-xl font-bold mb-6">Панель управления</h1>
    <nav class="space-y-1 text-sm">
      <a class="block p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800" href="/dashboard">Главная</a>
      <a class="block p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800" href="/agents">Агенты</a>
      <a class="block p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800" href="/profiles">Профили</a>
      <a class="block p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800" href="/audit">Аудит</a>
      <a class="block p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800" href="/analytics">Аналитика</a>
      <a class="block p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800" href="/tests">Тесты</a>
    </nav>
    <div class="mt-8 text-xs text-slate-500">Роль: <b>{{ user.role }}</b><br/>Пользователь: <b>{{ user.username }}</b></div>
  </aside>
  <main class="flex-1">
    <header class="bg-white/95 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
      <div>
        <div class="text-xs uppercase text-slate-500">Центр операций</div>
        <div class="font-semibold">{{ title or 'Панель управления' }}</div>
      </div>
      <div class="flex gap-2 items-center">
        <button @click="toggleTheme" class="text-xs px-3 py-2 rounded-lg bg-slate-200 dark:bg-slate-700">Сменить тему</button>
      </div>
    </header>
    <section class="p-4 md:p-6">{% block content %}{% endblock %}</section>
  </main>
</div>
<script>
function layout(){
  return {
    theme:'light',
    init(){
      this.theme = localStorage.getItem('theme') || 'light';
      document.documentElement.classList.toggle('dark', this.theme==='dark');
    },
    toggleTheme(){
      this.theme = this.theme==='dark' ? 'light' : 'dark';
      localStorage.setItem('theme', this.theme);
      document.documentElement.classList.toggle('dark', this.theme==='dark');
      toast(this.theme === 'dark' ? 'Включена тёмная тема' : 'Включена светлая тема');
    }
  }
}
function toast(msg, bad=false){
  const t=document.createElement('div');
  t.className=`fixed right-4 top-4 px-4 py-2 rounded-lg text-white z-50 shadow ${bad?'bg-red-500':'bg-emerald-600'}`;
  t.innerText=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2300);
}
</script>
</body>
</html>
