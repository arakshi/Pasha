<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    window.tailwind = window.tailwind || {}; window.tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>{{ title or 'Панель управления' }}</title>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
<div class="min-h-screen flex">
  <aside class="w-72 hidden lg:block bg-white/95 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 p-4 sticky top-0 h-screen">
    <h1 class="text-xl font-bold mb-6">Панель управления</h1>
    <nav class="space-y-1 text-sm">
      <a class="block p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800" href="/dashboard?user={{ active_user }}">Главная</a>
      <a class="block p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800" href="/agents?user={{ active_user }}">Агенты</a>
      <a class="block p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800" href="/profiles?user={{ active_user }}">Профили</a>
      <a class="block p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800" href="/audit?user={{ active_user }}">Аудит</a>
      <a class="block p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800" href="/analytics?user={{ active_user }}">Аналитика</a>
      <a class="block p-2 rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-800" href="/tests?user={{ active_user }}">Тесты</a>
    </nav>
    <div class="mt-8 text-xs text-slate-500">Роль: <b>{{ user.role }}</b><br/>Пользователь: <b>{{ user.username }}</b></div>
  </aside>
  <main class="flex-1">
    <header class="bg-white/95 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-10 gap-3">
      <div>
        <div class="text-xs uppercase text-slate-500">Центр операций</div>
        <div class="font-semibold">{{ title or 'Панель управления' }}</div>
      </div>
      <form method="get" action="{{ request.url.path }}" class="flex items-center gap-2">
        <label class="text-xs text-slate-500">Пользователь:</label>
        <select name="user" onchange="this.form.submit()" class="text-sm p-2 rounded-lg border bg-white text-slate-900 dark:bg-slate-800 dark:text-slate-100">
          {% for u in users_for_switch %}
          <option value="{{ u.username }}" {% if active_user == u.username %}selected{% endif %}>{{ u.username }} ({{ u.role }})</option>
          {% endfor %}
        </select>
      </form>
    </header>
    <section class="p-4 md:p-6">{% block content %}{% endblock %}</section>
  </main>
</div>
</body>
</html>
