{% extends 'base.html' %}
{% set title='Audit' %}
{% block content %}
<form method="get" class="grid md:grid-cols-3 gap-2 mb-3">
  <input name="user_filter" class="p-2 rounded border" placeholder="user" />
  <input name="action_filter" class="p-2 rounded border" placeholder="action" />
  <button class="p-2 rounded bg-indigo-600 text-white">Filter</button>
</form>
<div class="overflow-x-auto rounded-xl bg-white dark:bg-slate-800 shadow">
<table class="min-w-full text-sm">
<tr class="border-b"><th class="p-2">Time</th><th>User</th><th>Action</th><th>Details</th></tr>
{% for l in logs %}<tr class="border-b border-slate-200 dark:border-slate-700"><td class="p-2">{{ l.ts }}</td><td>{{ l.user }}</td><td>{{ l.action }}</td><td>{{ l.details }}</td></tr>{% endfor %}
</table>
</div>
{% endblock %}
